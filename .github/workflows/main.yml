name: Third Task

on:
    pull_request:
        branches: ["develop"]

permissions:
    contents: write

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5

              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run tests
              run: python -m pytest --cov=myapp --cov-fail-under=70

            - name: Upload the test file with the grading percentage
              run: python -m pytest --cov=myapp --cov-report=html:coverage.html

            - name: Upload coverage
              uses: actions/upload-artifact@v4

              with:
                  name: coverage-report
                  path: .
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: develop

            - name: Update README with Badge
              run: |
                  BADGE="[![Build Status](https://github.com/${{ github.repository }}/actions/workflows/main.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/main.yml)"

                  if ! grep -qF "github.com/${{ github.repository }}/actions/workflows/main.yml/badge.svg" README.md; then
                      echo -e "$BADGE\n\n$(cat README.md)" > README.md
                      
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      
                      git add README.md
                      git commit -m "docs: add build status badge"
                      git push origin develop
                  else
                      echo "Badge already exists."
                  fi
