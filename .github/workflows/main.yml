name: Python CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - develop

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5

              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run tests
              run: python -m pytest --cov=myapp --cov-fail-under=70

            - name: Upload the test file with the grading percentage
              run: python - pytest --cov myapp-cov-report.html:coverage.html

            - name: Upload coverage
              uses: actions/upload-artifact@v4

              with:
                  name: coverage-report
                  path: .
